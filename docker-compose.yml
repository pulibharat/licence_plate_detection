services:
  db:
    image: postgis/postgis:16-3.4
    container_name: licence_plate_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: plate_admin
      POSTGRES_PASSWORD: plate_admin_dev
      POSTGRES_DB: licence_plate
    ports:
      - "5432:5432"
    volumes:
      - licence_plate_pg_data:/var/lib/postgresql/data

volumes:
  licence_plate_pg_data:
